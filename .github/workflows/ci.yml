name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev,service]" pytest pytest-asyncio
      - run: python -m pytest -q
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pip-audit bandit && pip install -e .
      - run: pip-audit --strict || true      # report; tighten to a hard gate once the baseline is clean
      - run: bandit -r driftguard service -ll
