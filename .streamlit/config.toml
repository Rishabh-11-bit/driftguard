[theme]
base = "dark"
primaryColor = "#2dd4bf"
backgroundColor = "#0b1220"
secondaryBackgroundColor = "#131c2e"
textColor = "#e6edf7"
font = "sans serif"

[server]
headless = true
address = "127.0.0.1"          # never expose the demo on the network
enableXsrfProtection = true
enableCORS = true
maxUploadSize = 1

[browser]
gatherUsageStats = false
