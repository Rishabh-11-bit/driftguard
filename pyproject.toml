[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "driftguard"
version = "0.1.0"
description = "DriftGuard — Distinguishing Malicious Memory Poisoning from Benign Personalisation Drift in LLM Agents"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Tanisha Talathi", email = "tanisha.talathi@mitwpu.edu.in" },
    { name = "Aryaan Sethi",    email = "aryaan.sethi@mitwpu.edu.in" },
    { name = "Rishabh Gaikwad", email = "rishabh.gaikwad@mitwpu.edu.in" },
]
keywords = ["llm", "memory", "security", "adversarial", "langchain", "langgraph"]
license = { text = "MIT" }

dependencies = [
    # Agent & memory
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-ollama>=0.2.0",
    # Vector stores
    "faiss-cpu>=1.8.0",
    "chromadb>=0.5.0",
    # Embeddings & NLP
    "sentence-transformers>=3.0.0",
    "transformers>=4.40.0",
    # ML / evaluation
    "scikit-learn>=1.5.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    # Utilities
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
torch = [
    "torch>=2.3.0",
]
redis = [
    "redis>=5.0.0",
]
service = [
    "fastapi>=0.115.6",        # 0.109.0 has PYSEC-2024-38 (pip-audit); also pulls a patched starlette
    "starlette>=0.47.2",
    "python-multipart>=0.0.22",
    "uvicorn>=0.27",
    "httpx>=0.27",
]
app = [
    "streamlit>=1.40.0",
    "plotly>=5.20.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ipykernel",
    "jupyter",
    "black",
    "ruff",
    "mypy",
]

[tool.hatch.build.targets.wheel]
# Only the library and the service ship. eval/, scripts/ and app/ are research code run from a checkout
# (python -m scripts.<name>); installing them as top-level packages would collide with other projects.
packages = ["driftguard", "service"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
